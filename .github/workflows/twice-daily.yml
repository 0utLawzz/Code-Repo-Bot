name: Typography Poster — Twice Daily

on:
  # TEMPORARILY PAUSED: ChatGPT + Make will own brief/image orchestration.
  # Keep workflow_dispatch so this workflow can be manually tested or re-enabled later.
  workflow_dispatch:
    inputs:
      run_slot:
        description: "Run label"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: typography-poster-generator
  cancel-in-progress: false

jobs:
  generate-design-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill-first generator
        env:
          RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slot || (github.event.schedule == '0 4 * * *' && 'morning' || 'evening') }}
        run: python scripts/generate.py

      - name: Commit generated brief and duplicate history
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json outputs/
            git commit -m "Generate scheduled typography design brief"
            git push
          else
            echo "No new quote available; nothing to commit."
          fi
